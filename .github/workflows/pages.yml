name: Pages

# Deploys the website from site/ to GitHub Pages on a GitHub-hosted runner.
# Static for now; when scripts/build-site.py exists it renders into _site/
# instead, and this workflow keeps working. There is deliberately no
# 'release: published' trigger: a release must never redeploy the site
# (PLAN-ship R9).
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/build-site.py', '.github/workflows/pages.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # The same file lives in the private source repo until the source moves
    # here. There it must not run: a private repo has no free hosted minutes,
    # so every push of this file failed (run 36267282232). Skipped, it costs
    # nothing and reports nothing.
    if: github.repository == 'evanscastonguay/omac'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Actions are pinned by commit SHA: a tag can be moved, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Assemble the site
        run: |
          rm -rf _site && mkdir _site
          if [ -f scripts/build-site.py ]; then python3 scripts/build-site.py _site; else cp -R site/. _site/; fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
